plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '[7.0.150,7.1)'
}

version = "${mod_version}+neoforge-${minecraft_version}"
group = 'com.alexgodly'

base {
    archivesName = 'smooch'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        java.srcDir '../common/v120'
        resources.srcDir '../common/assets'
        if (cloth_config_version == 'none') {
            java.exclude '**/ConfigScreens.java', '**/ClothScreen.java'
        }
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    if (cloth_config_version != 'none') {
        compileOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") { transitive = false }
    }
}

processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'version': mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
