name: icons
on: workflow_dispatch
jobs:
  icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch icons and project info
        run: |
          mkdir -p /tmp/icons
          python3 - <<'PY'
          import json, urllib.request
          H={"User-Agent":"AlexGodly/icons"}
          ps=json.load(urllib.request.urlopen(urllib.request.Request("https://api.modrinth.com/v2/user/AlexGodly/projects",headers=H)))
          out=[]
          for p in ps:
              u=p.get("raw_icon_url") or p.get("icon_url")
              if u:
                  ext=u.rsplit(".",1)[-1].split("?")[0]
                  data=urllib.request.urlopen(urllib.request.Request(u,headers=H)).read()
                  open(f"/tmp/icons/{p['slug']}.{ext}","wb").write(data)
              out.append({k:p.get(k) for k in ("slug","title","description","categories","additional_categories","loaders","game_versions","project_type","id","status","body")})
          json.dump(out,open("/tmp/icons/projects.json","w"),indent=1)
          PY
          ls -la /tmp/icons
          git config user.name "Alex Godly"
          git config user.email "AlexGodly@users.noreply.github.com"
          git switch --orphan icons-tmp
          git rm -rfq . || true
          git clean -fdxq
          cp /tmp/icons/* .
          git add -A
          git commit -qm "Icons"
          git push -f origin HEAD:icons
