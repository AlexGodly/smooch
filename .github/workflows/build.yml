name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dirs:
        description: "Targets to build, space separated (empty = all)"
        required: false
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        env:
          DIRS: ${{ inputs.dirs }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          all_targets = json.load(open("publish/matrix.json"))
          names = {t["dir"] for t in all_targets}
          wanted = os.environ.get("DIRS", "").split()
          if os.environ["EVENT"] == "push":
              changed = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"],
                                       capture_output=True, text=True).stdout.split()
              tops = {c.split("/")[0] for c in changed}
              if tops & {"common", "tools"}:
                  wanted = sorted(names)
              else:
                  wanted = sorted(tops & names)
          elif not wanted:
              wanted = sorted(names)
          pick = [t for t in all_targets if t["dir"] in wanted]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": pick}) + "\n")
              out.write("any=" + ("true" if pick else "false") + "\n")
          print([t["dir"] for t in pick])
          PY

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve versions
        run: python3 tools/resolve.py ${{ matrix.dir }}/gradle.properties
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.dir }}
          path: ${{ matrix.dir }}/build/libs/smooch-*.jar

  publish:
    needs: [plan, build]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/jars
          merge-multiple: true
      - name: Push jars to the builds branch
        run: |
          rm -f /tmp/jars/*-sources.jar /tmp/jars/*-slim.jar /tmp/jars/*-dev.jar
          ls -la /tmp/jars
          git config user.name "Alex Godly"
          git config user.email "AlexGodly@users.noreply.github.com"
          git fetch --depth 1 origin builds && git switch -c builds-tmp FETCH_HEAD || git switch --orphan builds-tmp
          git rm -rfq --cached . >/dev/null 2>&1 || true
          git clean -fdxq
          git checkout FETCH_HEAD -- . 2>/dev/null || true
          cp /tmp/jars/*.jar .
          git add *.jar
          git commit -qm "Build ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:builds
