name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: fabric-1.20.1, java: 17 }
          - { dir: forge-1.20.1, java: 17 }
          - { dir: fabric-1.21.1, java: 21 }
          - { dir: neoforge-1.21.1, java: 21 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.dir }}
          path: ${{ matrix.dir }}/build/libs/smooch-*.jar

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/jars
          merge-multiple: true
      - name: Push jars to the builds branch
        run: |
          rm -f /tmp/jars/*-sources.jar /tmp/jars/*-slim.jar
          ls -la /tmp/jars
          git config user.name "Alex Godly"
          git config user.email "AlexGodly@users.noreply.github.com"
          git switch --orphan builds-tmp
          git rm -rfq . || true
          git clean -fdxq
          cp /tmp/jars/*.jar .
          git add *.jar
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f origin HEAD:builds
