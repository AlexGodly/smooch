name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: smooch-jars
          path: build/libs/*.jar
      - name: Publish jars to the builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/out && cp build/libs/*.jar /tmp/out/ && rm -f /tmp/out/*-sources.jar
          git config user.name "Alex Godly"
          git config user.email "AlexGodly@users.noreply.github.com"
          git fetch origin builds || true
          git switch --orphan builds-tmp
          git rm -rfq . || true
          git clean -fdxq
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f origin HEAD:builds
